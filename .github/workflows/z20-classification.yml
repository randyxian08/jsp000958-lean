name: JSP000622 Ramsey classification
on:
  push:
    branches: [work/jsp000622-z20-verification]
    paths: ['Z20/run_classification.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate candidates, complete blocking refutations and semantic witnesses
        run: bash Z20/run_classification.sh generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-classification-data-${{ github.run_id }}
          path: classification-output
          retention-days: 30
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - name: Check the generic classification soundness theorem
        run: bash Z20/run_classification.sh kernel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-classification-kernel-${{ github.run_id }}
          path: classification-output
          retention-days: 30
  replay:
    needs: [generate, kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: z20-classification-data-${{ github.run_id }}
          path: classification-data
      - name: Reconstruct each assigned finite proof in the Lean kernel
        run: bash Z20/run_classification.sh replay ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-classification-replay-${{ matrix.shard }}-${{ github.run_id }}
          path: classification-output
          retention-days: 30
