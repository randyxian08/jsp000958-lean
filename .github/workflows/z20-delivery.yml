name: JSP000622 proof source delivery
on:
  push:
    branches: [work/jsp000622-z20-verification]
    paths: ['Z20/delivery_run.txt']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: z20-closed-theorem-35174067645
          run-id: 35174067645
          github-token: ${{ github.token }}
          path: closed-evidence
      - uses: actions/download-artifact@v4
        with:
          name: z20-complete-data-35172668078
          run-id: 35172668078
          github-token: ${{ github.token }}
          path: complete-data
      - name: Check the real theorem receipt and package its exact source
        run: python3 Z20/package_proof.py prepare
      - name: Check manifest, shell syntax and Python helper syntax
        run: |
          python3 delivery/JSP000622-z20/verify_manifest.py
          bash -n delivery/JSP000622-z20/bootstrap.sh
          bash -n delivery/JSP000622-z20/verify.sh
          python3 -m py_compile delivery/JSP000622-z20/verify_manifest.py delivery/JSP000622-z20/audit_axioms.py
      - name: Produce and CRC-check the compact source archive
        run: python3 Z20/package_proof.py archive
      - uses: actions/upload-artifact@v4
        with:
          name: z20-complete-source-${{ github.run_id }}
          path: |
            delivery/JSP000622_z20_complete_source.zip
            delivery/PACKAGE.json
          compression-level: 0
          retention-days: 90
