name: JSP000622 pinned auxiliary proof replay
on:
  push:
    branches: [work/jsp000622-z20-verification]
    paths: ['Z20/verify_foundation.sh']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [8, 12, 13, 14, 15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - name: Reconstruct the pinned auxiliary sources
        run: bash Z20/verify_foundation.sh prepare
      - name: Check assigned kernel proof terms sequentially
        run: bash Z20/verify_foundation.sh shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-foundation-chunk-${{ matrix.shard }}-${{ github.run_id }}
          path: foundation-output
          retention-days: 30
  join:
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - name: Reconstruct the exact sources again
        run: bash Z20/verify_foundation.sh prepare
      - name: Retrieve the eleven successful, unchanged auxiliary shards
        uses: actions/download-artifact@v4
        with:
          pattern: z20-foundation-chunk-*-35130678189
          run-id: 35130678189
          github-token: ${{ github.token }}
          path: foundation-parts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: z20-foundation-chunk-*-${{ github.run_id }}
          path: foundation-parts
          merge-multiple: true
      - name: Join checked modules, verify theorems and audit axioms
        run: bash Z20/verify_foundation.sh join
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-foundation-joined-${{ github.run_id }}
          path: foundation-output
          retention-days: 30
