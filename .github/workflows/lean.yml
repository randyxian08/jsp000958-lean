name: JSP000622 two core certificates
on:
  push:
    branches: [work/jsp000622-z20-verification]
    paths: ['Z20/run.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jsp000622-core-certificates
  cancel-in-progress: false
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        core: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - name: Reconstruct the exact SAT proof and semantic witnesses
        run: bash Z20/run.sh "$GITHUB_WORKSPACE/.z20/project" "$GITHUB_WORKSPACE/core-output" ${{ matrix.core }}
      - name: Retain logs, proof objects and their exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z20-checked-core-${{ matrix.core }}-${{ github.run_id }}
          path: core-output
          retention-days: 30
