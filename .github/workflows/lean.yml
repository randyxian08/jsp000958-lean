name: JSP000622 proof iteration
on:
  push:
    branches: [work/jsp000622-z20-verification]
    paths: ['Z20/run.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jsp000622-proof-iteration
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: runtime
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
      - name: Prepare pinned runtime
        run: bash Z20/bootstrap.sh
      - uses: actions/cache/save@v4
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
      - name: Execute and audit this proof iteration
        run: bash Z20/run.sh "$GITHUB_WORKSPACE/.z20/project" "$GITHUB_WORKSPACE/logs"
      - name: Retain logs and exact generated proof sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z20-iteration-${{ github.run_id }}
          path: |
            logs
            .z20/project/JSP000622
            Z20
          retention-days: 30
