name: JSP000622 final proof assembly
on:
  push:
    branches: [work/jsp000622-z20-verification]
    paths: ['Z20/resume_run.txt']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cores:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: z20-complete-data-35172668078
          run-id: 35172668078
          github-token: ${{ github.token }}
          path: complete-data
      - uses: actions/download-artifact@v4
        with:
          name: z20-complete-finite-${{ matrix.shard }}-35172668078
          run-id: 35172668078
          github-token: ${{ github.token }}
          path: prior-core
      - name: Restore successful clause modules from the previous failed interface build
        run: tar --zstd -xf prior-core/finite-${{ matrix.shard }}.tar.zst -C .z20/project
      - name: Recompile the repaired interface and audit the graph packing theorem
        run: python3 Z20/complete_build.py finite ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-resumed-core-${{ matrix.shard }}-${{ github.run_id }}
          path: complete-output
          retention-days: 30
  join:
    needs: cores
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .z20/project/.lake/build
          key: z20-auxiliary433-8822f7d-verified-v1
          fail-on-cache-miss: true
      - name: Restore precisely pinned upstream proof sources
        run: bash Z20/verify_foundation.sh prepare
      - uses: actions/download-artifact@v4
        with:
          name: z20-complete-data-35172668078
          run-id: 35172668078
          github-token: ${{ github.token }}
          path: complete-data
      - name: Retrieve the six fully verified classification shards
        uses: actions/download-artifact@v4
        with:
          pattern: z20-complete-finite-[0-5]-35172668078
          run-id: 35172668078
          github-token: ${{ github.token }}
          path: complete-parts
      - uses: actions/download-artifact@v4
        with:
          pattern: z20-resumed-core-*-${{ github.run_id }}
          path: complete-parts
      - name: Check closed z(20)=6 and replay all constants in a fresh kernel environment
        run: python3 Z20/complete_build.py join
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-final-assembly-${{ github.run_id }}
          path: complete-output
          retention-days: 30
