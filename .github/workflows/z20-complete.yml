name: JSP000622 complete proof verification
on:
  push:
    branches: [work/jsp000622-z20-verification]
    paths: ['Z20/complete_run.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduce the exact finite data snapshot
        run: |
          python3 -m venv .proof-venv
          .proof-venv/bin/pip -q install networkx==3.4.2 python-sat==1.8.dev24
          .proof-venv/bin/python Z20/complete_build.py generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-complete-data-${{ github.run_id }}
          path: complete-output
          retention-days: 30
  finite:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: z20-complete-data-${{ github.run_id }}
          path: complete-data
      - name: Compile and audit all assigned graph certificates
        run: python3 Z20/complete_build.py finite ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-complete-finite-${{ matrix.shard }}-${{ github.run_id }}
          path: complete-output
          retention-days: 30
  join:
    needs: finite
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .z20/project/.lake/build
          key: z20-auxiliary433-8822f7d-verified-v1
          fail-on-cache-miss: true
      - name: Restore precisely pinned auxiliary sources
        run: bash Z20/verify_foundation.sh prepare
      - uses: actions/download-artifact@v4
        with:
          name: z20-complete-data-${{ github.run_id }}
          path: complete-data
      - uses: actions/download-artifact@v4
        with:
          pattern: z20-complete-finite-*-${{ github.run_id }}
          path: complete-parts
      - name: Compile the closed theorem and replay its entire kernel environment
        run: python3 Z20/complete_build.py join
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-complete-final-${{ github.run_id }}
          path: complete-output
          retention-days: 30
