name: JSP000622 analytic proof checks
on:
  push:
    branches: [work/jsp000622-z20-verification]
    paths: ['Z20/check_theory.sh']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .z20
          key: z20-runtime433-db584cd-v2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        id: auxiliary
        with:
          path: .z20/project/.lake/build
          key: z20-auxiliary433-8822f7d-verified-v1
      - uses: actions/download-artifact@v4
        if: steps.auxiliary.outputs.cache-hit != 'true'
        with:
          name: z20-foundation-joined-35132762685
          run-id: 35132762685
          github-token: ${{ github.token }}
          path: verified-auxiliary
      - name: Import the already kernel-checked auxiliary modules
        if: steps.auxiliary.outputs.cache-hit != 'true'
        run: |
          tar --zstd -xf verified-auxiliary/checked-auxiliary-build.tar.zst -C .z20/project
      - uses: actions/cache/save@v4
        if: steps.auxiliary.outputs.cache-hit != 'true'
        with:
          path: .z20/project/.lake/build
          key: z20-auxiliary433-8822f7d-verified-v1
      - name: Restore precisely pinned auxiliary sources
        run: bash Z20/verify_foundation.sh prepare
      - uses: actions/download-artifact@v4
        with:
          name: z20-classification-data-35134879843
          run-id: 35134879843
          github-token: ${{ github.token }}
          path: classification-data
      - name: Check analytic lemmas and representative finite certificate modules
        run: bash Z20/check_theory.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z20-theory-${{ github.run_id }}
          path: |
            theory-output
            foundation-output
          retention-days: 30
